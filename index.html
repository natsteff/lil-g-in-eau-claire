<!doctype html>
<html lang="en">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="apple-mobile-web-app-title" content="Lil G in EC">
<meta name="theme-color" content="#091727">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="apple-touch-icon" href="./assets/branding/icon-180.png">
<title>Lil G in EC</title>
<style>
*{box-sizing:border-box} body{margin:0;background:#091727;color:#fff;font:600 16px system-ui;display:grid;place-items:center;min-height:100dvh;padding:12px}
main{width:min(100%,1100px)} header,nav{display:flex;justify-content:space-between;align-items:center;gap:8px;margin:8px 0}
.stage{position:relative;background:#000;border:2px solid #eab455;border-radius:12px;overflow:hidden}
canvas{display:block;width:100%;height:auto} #menu{position:absolute;inset:0;display:grid;place-content:center;justify-items:center;text-align:center;background:#06101be8;padding:12px;overflow:auto}
#menu[hidden]{display:none} #menu img{width:min(60vw,390px);max-height:45dvh;object-fit:contain}
button{font:inherit;color:#fff;background:#203e57;border:1px solid #7b9aae;border-radius:9px;padding:9px 14px;touch-action:none;cursor:pointer}
#start{background:#efb548;color:#151009} nav button{min-width:54px} small{color:#b8c9d9}
@media (orientation:landscape) and (max-height:520px){main{width:min(100%,calc((100dvh - 110px)*2.5))}body{padding:0} #menu img{max-height:32dvh}}
</style>
<main>
<header><span id="status" aria-live="polite">Lil’ G in Eau Claire</span><button id="pause" type="button">Pause</button></header>
<div class="stage">
<canvas id="game" width="960" height="384" aria-label="Lil’ G side-scrolling game"></canvas>
<section id="menu"><img src="./assets/branding/main-logo.png" alt="The Great Monkey Beer Run — Lil’ G in Eau Claire"><p id="message">Pick up the beer and deliver it across town.</p><button id="start">Start run</button></section>
</div>
<nav aria-label="Game controls">
<div><button data-key="left" aria-label="Move left">◀</button> <button data-key="right" aria-label="Move right">▶</button></div>
<div><button data-key="action">Action</button> <button data-key="jump">Jump</button></div>
</nav>
<small>Move: A/D or arrows · Jump: Space · Action: F · Pause: P</small>
</main>
<script type="module" src="./game.js"></script>
</html>
